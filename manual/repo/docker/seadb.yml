services:
  seadb:
    image: ${SEADB_IMAGE:-seafileltd/seadb:0.9-latest}
    restart: unless-stopped
    container_name: seadb
    ports:
      - "8888:8888"
    volumes:
      - ${SEADB_VOLUME:-/opt/seadb-data}:/shared
    environment:
      LOG_TO_STDOUT: "${LOG_TO_STDOUT:-false}"
      TZ: "${TIME_ZONE:-UTC}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set and non-empty}"
      INIT_SEADB_ROOT_PASSWORD: "${INIT_SEADB_ROOT_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
